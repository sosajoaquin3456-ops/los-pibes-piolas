<body>
 
  <h1 id="titulo">los pibes piolas</h1>

<script>



 function cambiarTitulo() { 
 
document.getElementById("titulo").textContent= "la fri señal";
}

function cambiarColor() {
 
document.getElementById("titulo").style.color= "fuchsia";
}

function cambiarFondo() {
 
  document.body.style.backgroundColor= "pink";
}

document.getElementById("titulo").style.fontSize = "60px";
}

function achicarTitulo() {
  
document.getElementById("titulo").style.fontSize= "25px";
}

function agrandarMensaje() {
  
document.getElementById("mensaje").style.fontSize= "30px";
}

function achicarMensaje() {
  
document.getElementById("mensaje").style.fontSize= "10px";
}

function cambiarMensaje() {
  
document.getElementById("mensaje").innerHTML = "son trolazos";
}

function modoFiesta() {
  
document.getElementById("titulo").textContent= "Modo fiesta";

document.getElementById("titulo").style.fontSize= "60px"
  document.body.style.backgroundColor= "purple";
  
  document.getElementById("mensaje").textContent= "¡Los pibes están en modo fiesta!";
}

function modoNormal() {
  
document.getElementById("titulo").textContent= "los pibes piolas";

 document.body.style.backgroundColor= "black";
 
 document.getElementById("mensaje").textContent= "quién de los pibes quiere jugar free";
}

let jugador = "Los pibes";
let juego = "free fire";
let puntos = 20;

puntos = puntos +1

 alert (jugador)
 alert (juego)
 alert (puntos)

document.getElementById("datos").textContent =
 "Juego: " + juego + " | Puntos: " + puntos;
 
function sumarPunto() {
  puntos++;
  
document.getElementById("datos").textContent = 
 "Juego: " + juego + "Puntos: " + puntos;
}
 
 function restarPunto() {
if (puntos >0) {
  puntos--;
} else {
 alert ("¡No quedan puntos!")
}


document.getElementById("datos").textContent = 
 "Juego: " + juego + "Puntos: " + puntos;
 }
